<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 NFL Projector</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #2563eb;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-gold: #eab308;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 75px; }
    header { background-color: #020617; padding: 14px; text-align: center; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 100; }
    header h1 { font-size: 1.15rem; text-transform: uppercase; color: var(--accent-gold); letter-spacing: 0.5px; }

    .nav-tabs { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background-color: #020617; border-top: 1px solid var(--card-border); z-index: 1000; }
    .nav-btn { flex: 1; padding: 14px 0; background: none; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
    .nav-btn.active { color: var(--accent-gold); border-top: 3px solid var(--accent-gold); background-color: #0f172a; }

    .tab-content { display: none; padding: 12px; max-width: 650px; margin: 0 auto; }
    .tab-content.active { display: block; }

    .division-grid, .teams-sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .div-btn, .team-btn-nav { background-color: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .div-btn.active, .team-btn-nav.active { background-color: var(--accent-blue); border-color: #60a5fa; }

    .game-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .game-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .game-matchup { display: flex; align-items: center; gap: 8px; }

    .pick-btn { flex: 1; padding: 10px 6px; border-radius: 6px; border: 1px solid var(--card-border); background-color: #0f172a; color: var(--text-main); font-weight: 600; font-size: 0.85rem; cursor: pointer; margin-top: 4px; margin-bottom: 4px; display: block; width: 100%; text-align: center; }
    .pick-btn.selected-win { background-color: var(--accent-green); border-color: #4ade80; color: #ffffff; }
    .pick-btn.selected-loss { background-color: #334155; color: #94a3b8; opacity: 0.5; }
    .vs-text { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }

    .standings-sec { margin-bottom: 20px; }
    .standings-title { font-size: 0.95rem; color: var(--accent-gold); margin-bottom: 6px; border-left: 3px solid var(--accent-gold); padding-left: 8px; font-weight: bold; }
    .standings-table { width: 100%; border-collapse: collapse; background-color: var(--card-bg); border-radius: 8px; overflow: hidden; font-size: 0.8rem; }
    .standings-table th, .standings-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--card-border); }
    .standings-table th { background-color: #0f172a; color: var(--text-muted); font-size: 0.7rem; }
    .standings-table td:first-child, .standings-table th:first-child { text-align: left; padding-left: 10px; }

    .bracket-sec { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
    .bracket-title { font-size: 0.95rem; color: var(--accent-gold); text-align: center; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; }
    .seed-bye-box { background-color: #0f172a; border: 1px dashed var(--accent-gold); border-radius: 8px; padding: 10px; text-align: center; margin-bottom: 12px; font-weight: bold; color: var(--accent-gold); font-size: 0.85rem; }
    .matchup-box { background-color: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 8px; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }

    .reset-btn { display: block; width: 100%; padding: 12px; background-color: var(--accent-red); color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; margin-top: 15px; cursor: pointer; }
  </style>
</head>
<body>

  <header><h1>2026 NFL Projector</h1></header>

  <div id="tab-schedules" class="tab-content active">
    <div class="division-grid" id="div-nav"></div>
    <div class="teams-sub-grid" id="team-nav"></div>
    <div id="schedule-list"></div>
  </div>

  <div id="tab-standings" class="tab-content">
    <div id="standings-container"></div>
  </div>

  <div id="tab-playoffs" class="tab-content">
    <div id="playoffs-container"></div>
    <button class="reset-btn" onclick="resetAllData()">Reset All Picks</button>
  </div>

  <nav class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('schedules')">Schedules</button>
    <button class="nav-btn" onclick="switchTab('standings')">Standings</button>
    <button class="nav-btn" onclick="switchTab('playoffs')">Playoffs</button>
  </nav>

      "14|Thu|20:15|Steelers|Jaguars","14|Sun|13:00|Vikings|Patriots","14|Sun|13:00|Bears|Dolphins","14|Sun|13:00|Broncos|Jets","14|Sun|13:00|Colts|Eagles","14|Sun|13:00|Buccaneers|Ravens","14|Sun|13:00|Falcons|Browns","14|Sun|13:00|Texans|Commanders","14|Sun|13:00|Panthers|Saints","14|Sun|16:05|Giants|Seahawks","14|Sun|16:25|Rams|Lions","14|Sun|16:25|Chargers|49ers","14|Sun|20:20|Chiefs|Raiders",

      "17|Sun|13:00|Bills|Dolphins","17|Sun|13:00|Vikings|Jets","17|Sun|13:00|Bengals|Steelers","17|Sun|13:00|Ravens|Browns","17|Sun|13:00|Colts|Jaguars","17|Sun|13:00|Titans|Texans","17|Sun|13:00|Falcons|Buccaneers","17|Sun|13:00|Saints|Panthers","17|Sun|13:00|Bears|Lions","17|Sun|13:00|Commanders|Packers","17|Sun|16:05|Cardinals|Rams","17|Sun|16:25|Eagles|49ers","17|Sun|16:25|Giants|Cowboys","17|Sun|16:25|Chargers|Chiefs","17|Sun|16:25|Raiders|Broncos","17|Sun|20:20|Patriots|Seahawks",

    const SCHEDULE_DATA = RAW_SCHEDULE.map((str, idx) => {
      const [w, day, time, away, home] = str.split('|');
      return { id: `g2026_${idx + 1}`, week: parseInt(w), day, time, away, home };
    });

    let userPicks = JSON.parse(localStorage.getItem('nfl_picks_v2')) || {};
    let playoffPicks = JSON.parse(localStorage.getItem('nfl_playoffs_v2')) || {};
    let activeDiv = "NFC East";
    let activeTeam = "Eagles";

    function saveState() {
      localStorage.setItem('nfl_picks_v2', JSON.stringify(userPicks));
      localStorage.setItem('nfl_playoffs_v2', JSON.stringify(playoffPicks));
    }

    function resetAllData() {
      if (confirm("Reset all picks?")) {
        userPicks = {}; playoffPicks = {};
        saveState();
        renderSchedules(); renderStandings(); renderPlayoffs();
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');
      if (tabName === 'standings') renderStandings();
      if (tabName === 'playoffs') renderPlayoffs();
    }

    function initSchedulesNav() {
      const divNav = document.getElementById('div-nav');
      divNav.innerHTML = '';
      Object.keys(DIVISIONS).forEach(div => {
        const btn = document.createElement('button');
        btn.className = `div-btn ${div === activeDiv ? 'active' : ''}`;
        btn.innerText = div;
        btn.onclick = () => {
          activeDiv = div; activeTeam = DIVISIONS[div][0];
          initSchedulesNav(); renderTeamNav(); renderSchedules();
        };
        divNav.appendChild(btn);
      });
      renderTeamNav();
    }

    function renderTeamNav() {
      const teamNav = document.getElementById('team-nav');
      teamNav.innerHTML = '';
      DIVISIONS[activeDiv].forEach(team => {
        const btn = document.createElement('button');
        btn.className = `team-btn-nav ${team === activeTeam ? 'active' : ''}`;
        btn.innerText = team;
        btn.onclick = () => { activeTeam = team; renderTeamNav(); renderSchedules(); };
        teamNav.appendChild(btn);
      });
    }

    function renderSchedules() {
      const list = document.getElementById('schedule-list');
      list.innerHTML = '';
      const teamGames = SCHEDULE_DATA.filter(g => g.away === activeTeam || g.home === activeTeam);

      for (let w = 1; w <= 18; w++) {
        const game = teamGames.find(g => g.week === w);
        const card = document.createElement('div');
        card.className = 'game-card';

        if (!game) {
          card.innerHTML = `<div class="game-header"><span>WEEK ${w}</span><span>BYE WEEK</span></div><div style="font-size:0.85rem; color:var(--text-muted); text-align:center;">No game scheduled</div>`;
        } else {
          const pickedWinner = userPicks[game.id];
          card.innerHTML = `
            <div class="game-header">
              <span>WEEK ${game.week} • ${game.day} ${game.time} ET</span>
              <span>${game.away === activeTeam ? 'AWAY' : 'HOME'}</span>
            </div>
            <div class="game-matchup">
              <button class="pick-btn ${pickedWinner === game.away ? 'selected-win' : (pickedWinner ? 'selected-loss' : '')}" 
                      onclick="makePick('${game.id}', '${game.away}')">
                ${game.away}
              </button>
              <span class="vs-text">@</span>
              <button class="pick-btn ${pickedWinner === game.home ? 'selected-win' : (pickedWinner ? 'selected-loss' : '')}" 
                      onclick="makePick('${game.id}', '${game.home}')">
                ${game.home}
              </button>
            </div>
          `;
        }
        list.appendChild(card);
      }
    }

    function makePick(gameId, winner) {
      if (userPicks[gameId] === winner) { delete userPicks[gameId]; } 
      else { userPicks[gameId] = winner; }
      saveState(); renderSchedules();
    }

    function calculateStandings() {
      const stats = {};
      Object.keys(TEAMS).forEach(t => { stats[t] = { name: t, w: 0, l: 0, divW: 0, divL: 0, confW: 0, confL: 0 }; });
      
      SCHEDULE_DATA.forEach(g => {
        const winner = userPicks[g.id];
        if (!winner) return;
        const loser = winner === g.home ? g.away : g.home;
        stats[winner].w += 1; stats[loser].l += 1;
        if (TEAMS[winner].div === TEAMS[loser].div) { stats[winner].divW += 1; stats[loser].divL += 1; }
        if (TEAMS[winner].conf === TEAMS[loser].conf) { stats[winner].confW += 1; stats[loser].confL += 1; }
      });
      return stats;
    }

    function getSortedDivisions() {
      const stats = calculateStandings();
      const divRankings = {};
      Object.keys(DIVISIONS).forEach(div => {
        let teams = [...DIVISIONS[div]];
        teams.sort((a, b) => (stats[b].w - stats[a].w) || (stats[b].divW - stats[a].divW) || (stats[b].confW - stats[a].confW));
        divRankings[div] = teams.map(t => stats[t]);
      });
      return divRankings;
    }

    function renderStandings() {
      const container = document.getElementById('standings-container');
      container.innerHTML = '';
      const divRankings = getSortedDivisions();

      Object.keys(divRankings).forEach(div => {
        const sec = document.createElement('div');
        sec.className = 'standings-sec';
        let rowsHTML = divRankings[div].map(t => {
          const total = t.w + t.l;
          const pct = total === 0 ? '.000' : (t.w / total).toFixed(3).replace('0.', '.');
          return `<tr><td><strong>${t.name}</strong></td><td>${t.w}</td><td>${t.l}</td><td>${pct}</td><td>${t.divW}-${t.divL}</td><td>${t.confW}-${t.confL}</td></tr>`;
        }).join('');

        sec.innerHTML = `<div class="standings-title">${div}</div><table class="standings-table"><thead><tr><th>TEAM</th><th>W</th><th>L</th><th>PCT</th><th>DIV</th><th>CONF</th></tr></thead><tbody>${rowsHTML}</tbody></table>`;
        container.appendChild(sec);
      });
    }

    function getConferenceSeeds(conf) {
      const divRankings = getSortedDivisions();
      let divWinners = [], wildcards = [];
      Object.keys(divRankings).forEach(div => {
        if (div.startsWith(conf)) {
          divWinners.push(divRankings[div][0]);
          wildcards.push(...divRankings[div].slice(1));
        }
      });
      divWinners.sort((a, b) => b.w - a.w);
      wildcards.sort((a, b) => b.w - a.w);
      return [...divWinners, ...wildcards.slice(0, 3)];
    }

    function renderPlayoffs() {
      const container = document.getElementById('playoffs-container');
      container.innerHTML = '';
      const afcSeeds = getConferenceSeeds("AFC");
      const nfcSeeds = getConferenceSeeds("NFC");

      container.appendChild(renderConferenceBracket("AFC", afcSeeds));
      container.appendChild(renderConferenceBracket("NFC", nfcSeeds));
      container.appendChild(renderSuperBowl(afcSeeds, nfcSeeds));
    }

    function renderConferenceBracket(conf, seeds) {
      const sec = document.createElement('div');
      sec.className = 'bracket-sec';
      let html = `<div class="bracket-title">${conf} Playoff Bracket</div>`;

      // Prominent #1 Seed Bye Display
      const topSeed = seeds[0];
      if (topSeed) {
        html += `<div class="seed-bye-box">⭐ #1 SEED BYE: ${topSeed.name} (${topSeed.w}-${topSeed.l}) ⭐</div>`;
      } else {
        html += `<div class="seed-bye-box">⭐ #1 SEED BYE: TBD ⭐</div>`;
      }

      // Wild Card Round
      html += `<div style="font-size:0.8rem; color:var(--accent-gold); margin:8px 0 6px; font-weight:bold;">1. WILD CARD ROUND</div>`;
      const wcMatches = [
        { key: `${conf}_WC1`, high: seeds[1], low: seeds[6] },
        { key: `${conf}_WC2`, high: seeds[2], low: seeds[5] },
        { key: `${conf}_WC3`, high: seeds[3], low: seeds[4] }
      ];

      wcMatches.forEach(m => {
        html += `<div class="matchup-box">${renderMatchupBtns(m.key, m.high, m.low)}</div>`;
      });

      // Wild Card Winners
      const wcWinners = [];
      wcMatches.forEach(m => {
        const picked = playoffPicks[m.key];
        if (picked) {
          const t = [m.high, m.low].find(x => x?.name === picked);
          if (t) wcWinners.push(t);
        }
      });

      // Divisional Round
      html += `<div style="font-size:0.8rem; color:var(--accent-gold); margin:12px 0 6px; font-weight:bold;">2. DIVISIONAL ROUND</div>`;
      if (wcWinners.length < 3) {
        html += `<div style="font-size:0.75rem; color:var(--text-muted); padding:8px; text-align:center;">Pick all 3 Wild Card winners to unlock Divisional matchups</div>`;
      } else {
        const divTeams = [seeds[0], ...wcWinners].sort((a,b) => seeds.indexOf(a) - seeds.indexOf(b));
        const divMatches = [
          { key: `${conf}_DIV1`, high: divTeams[0], low: divTeams[3] },
          { key: `${conf}_DIV2`, high: divTeams[1], low: divTeams[2] }
        ];

        divMatches.forEach(m => {
          html += `<div class="matchup-box">${renderMatchupBtns(m.key, m.high, m.low)}</div>`;
        });

        // Conference Championship
        const divWinners = [];
        divMatches.forEach(m => {
          const picked = playoffPicks[m.key];
          if (picked) {
            const t = [m.high, m.low].find(x => x?.name === picked);
            if (t) divWinners.push(t);
          }
        });

        html += `<div style="font-size:0.8rem; color:var(--accent-gold); margin:12px 0 6px; font-weight:bold;">3. ${conf} CHAMPIONSHIP</div>`;
        if (divWinners.length < 2) {
          html += `<div style="font-size:0.75rem; color:var(--text-muted); padding:8px; text-align:center;">Pick both Divisional winners to unlock Championship</div>`;
        } else {
          divWinners.sort((a,b) => seeds.indexOf(a) - seeds.indexOf(b));
          html += `<div class="matchup-box">${renderMatchupBtns(`${conf}_CONF`, divWinners[0], divWinners[1])}</div>`;
        }
      }

      sec.innerHTML = html;
      return sec;
    }

    function renderSuperBowl(afcSeeds, nfcSeeds) {
      const sec = document.createElement('div');
      sec.className = 'bracket-sec';
      let html = `<div class="bracket-title">SUPER BOWL</div>`;

      const afcChampName = playoffPicks["AFC_CONF"];
      const nfcChampName = playoffPicks["NFC_CONF"];

      const afcChamp = afcSeeds.find(s => s.name === afcChampName);
      const nfcChamp = nfcSeeds.find(s => s.name === nfcChampName);

      if (!afcChamp || !nfcChamp) {
        html += `<div style="font-size:0.75rem; color:var(--text-muted); padding:10px; text-align:center;">Pick AFC and NFC Champions to unlock the Super Bowl!</div>`;
      } else {
        html += `<div class="matchup-box">${renderMatchupBtns("SUPER_BOWL", afcChamp, nfcChamp)}</div>`;
        const sbWinner = playoffPicks["SUPER_BOWL"];
        if (sbWinner) {
          html += `<div style="text-align:center; padding:12px; font-weight:bold; color:var(--accent-gold); font-size:1.1rem; border:1px solid var(--accent-gold); border-radius:8px; margin-top:10px; background-color:#0f172a;">🏆 SUPER BOWL CHAMPION: ${sbWinner.toUpperCase()} 🏆</div>`;
        }
      }

      sec.innerHTML = html;
      return sec;
    }

    function renderMatchupBtns(matchKey, t1, t2) {
      if (!t1 || !t2) return `<div style="padding:6px; color:#64748b;">TBD</div>`;
      const picked = playoffPicks[matchKey];
      return `
        <button class="pick-btn ${picked === t1.name ? 'selected-win' : (picked ? 'selected-loss' : '')}" onclick="pickPlayoff('${matchKey}', '${t1.name}')">
          ${t1.name}
        </button>
        <span class="vs-text">vs</span>
        <button class="pick-btn ${picked === t2.name ? 'selected-win' : (picked ? 'selected-loss' : '')}" onclick="pickPlayoff('${matchKey}', '${t2.name}')">
          ${t2.name}
        </button>
      `;
    }

    function pickPlayoff(matchKey, teamName) {
      if (playoffPicks[matchKey] === teamName) { delete playoffPicks[matchKey]; } 
      else { playoffPicks[matchKey] = teamName; }
      saveState(); renderPlayoffs();
    }

    initSchedulesNav();
    renderSchedules();
  </script>
</body>
</html>
